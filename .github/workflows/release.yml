name: Build Versioned Desktop Apps
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        run: node scripts/check_version.cjs
      - name: Build universal app
        run: bash scripts/build_mac.sh
      - name: Test workbook parsing and embedded browser
        run: bash scripts/test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-universal
          path: |
            dist/*.zip
          if-no-files-found: error
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-fund
      - name: Check release versions
        run: node scripts/check_version.cjs
      - name: Workbook, preservation and publish safety tests
        run: npm test
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate
      - name: Embedded-browser test on Windows
        if: matrix.platform == 'windows'
        run: npm run test:browser
      - name: Embedded-browser test on Linux
        if: matrix.platform == 'linux'
        run: xvfb-run -a npm run test:browser
      - name: Package Windows installer
        if: matrix.platform == 'windows'
        run: npm run dist:windows
      - name: Install and smoke-test Windows distribution
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist/desktop/*-Setup.exe" | Select-Object -First 1
          $target = Join-Path $env:RUNNER_TEMP "AmazonCarouselUpdater"
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$target" -PassThru -Wait
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $p = Start-Process -FilePath "$target/amazon-carousel-updater.exe" -ArgumentList "--self-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Packaged app self-test failed: $($p.ExitCode)" }
      - name: Package Linux Mint installer
        if: matrix.platform == 'linux'
        run: npm run dist:linux
      - name: Install and smoke-test Linux package
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./dist/desktop/*.deb
          xvfb-run -a amazon-carousel-updater --self-test
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-x64
          path: |
            dist/desktop/*.exe
            dist/desktop/*.deb
          if-no-files-found: error
  mint-22-base:
    needs: desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: packages
      - name: Install and test on the Ubuntu base used by Linux Mint 22
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ./packages/*.deb
          xvfb-run -a amazon-carousel-updater --self-test
  release:
    needs: [mac, desktop, mint-22-base]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish versioned downloads only after all platforms pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum dist/*.zip dist/*.exe dist/*.deb | sed 's|dist/||' > dist/SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.exe dist/*.deb dist/SHA256SUMS.txt --title "Amazon Carousel Updater ${GITHUB_REF_NAME}" --notes-file release_notes.md --verify-tag
  website:
    needs: release
    if: github.ref_type == 'tag'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
